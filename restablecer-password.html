<!DOCTYPE html>
<html class="page-recuperar-password page-restablecer-password" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Crear contraseña nueva | S.G.D.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=20261030">
</head>
<body data-theme="light">
    <script>
        try {
            const temaGuardado = localStorage.getItem("tema-sgd");
            if (temaGuardado) {
                document.body.classList.toggle("tema-oscuro", temaGuardado === "oscuro");
                document.body.setAttribute("data-theme", temaGuardado === "oscuro" ? "dark" : "light");
            }
        } catch {}
    </script>
    <a class="logo-empresa revelar" href="index.html" aria-label="Seguridad Global de Datos, inicio">
        <img src="73667-transparente.svg" alt="Seguridad Global de Datos">
    </a>

    <nav class="controles-tema" aria-label="Selector de tema">
        <button id="boton-tema" class="tema-btn" type="button" aria-label="Cambiar a tema oscuro" title="Cambiar tema">🌙</button>
        <a class="recuperar-inicio" href="index.html">Volver al inicio</a>
    </nav>

    <main class="contenedor">
        <div class="siglas-marca revelar" role="img" aria-label="S.G.D.">
            <span class="s" aria-hidden="true">S.</span>
            <span class="g" aria-hidden="true">G.</span>
            <span class="d" aria-hidden="true">D.</span>
        </div>
        <h1 class="revelar">Crear contraseña nueva</h1>

        <form id="form-restablecer" class="revelar">
            <p>Elegí una contraseña de al menos 12 caracteres.</p>
            <label for="nueva-contrasena">Nueva contraseña</label>
            <input type="password" id="nueva-contrasena" autocomplete="new-password" minlength="12" maxlength="1024" required>

            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input type="password" id="confirmar-contrasena" autocomplete="new-password" minlength="12" maxlength="1024" required>

            <button type="submit">Guardar contraseña</button>
            <p id="estado-restablecer" class="estado-recuperacion" role="status" aria-live="polite"></p>
        </form>

        <div id="confirmacion-restablecer" class="panel-confirmacion revelar" style="display: none;">
            <h2>Contraseña actualizada</h2>
            <p>Ya podés iniciar sesión con tu contraseña nueva.</p>
            <a href="cuenta.html">Ir a iniciar sesión</a>
        </div>

        <div class="volver revelar">
            <a href="cuenta.html">← Volver a iniciar sesión</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
