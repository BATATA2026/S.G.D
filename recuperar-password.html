<!DOCTYPE html>
<html class="page-recuperar-password" lang="es">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | S.G.D.</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=20261030">
    
</head>
<body data-theme="light">
    <script>
        try {
            const movimientoDesactivado = localStorage.getItem("sgd-animaciones") === "desactivadas";
            document.documentElement.classList.toggle("animaciones-deshabilitadas", movimientoDesactivado);
            if (!movimientoDesactivado) document.documentElement.classList.add("animaciones-listas");
        } catch { document.documentElement.classList.add("animaciones-listas"); }
        try {
            const temaGuardado = localStorage.getItem("tema-sgd");
            if (temaGuardado) {
                document.body.classList.toggle("tema-oscuro", temaGuardado === "oscuro");
                document.body.setAttribute("data-theme", temaGuardado === "oscuro" ? "dark" : "light");
            }
        } catch {}
    </script>
    <a class="logo-empresa revelar" href="index.html" aria-label="Seguridad Global de Datos, inicio">
        <img src="73667-transparente.svg" alt="Seguridad Global de Datos">
    </a>

    <nav class="controles-tema" aria-label="Selector de tema">
        <button id="boton-tema" class="tema-btn" type="button" aria-label="Cambiar a tema oscuro" title="Cambiar tema">🌙</button>
        <a class="recuperar-inicio" href="index.html">Volver al inicio</a>
    </nav>

    <div class="contenedor">
        <div class="siglas-marca revelar" role="img" aria-label="S.G.D.">
            <span class="s" aria-hidden="true">S.</span>
            <span class="g" aria-hidden="true">G.</span>
            <span class="d" aria-hidden="true">D.</span>
        </div>
        <h1 class="revelar">Recuperar contraseña</h1>

        <div id="formulario-recuperacion" class="revelar">
            <p>Ingresá tu correo electrónico para recibir un enlace de recuperación.</p>

            <form id="form-recuperar">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" autocomplete="email" required>

                <button type="submit">Enviar correo</button>
                <p id="estado-recuperacion" class="estado-recuperacion" role="status" aria-live="polite"></p>
            </form>
        </div>

        <div id="panel-confirmacion" class="panel-confirmacion revelar">
            <h2>Revisá tu correo</h2>
            <p>Si existe una cuenta asociada a ese correo, recibirás un enlace para crear una contraseña nueva. El enlace vence en 30 minutos.</p>
        </div>

        <div class="volver revelar">
            <a href="cuenta.html">← Volver a iniciar sesión</a>
        </div>
    </div>

    

    <script src="script.js"></script>
</body>
</html>
